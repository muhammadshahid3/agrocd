apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/muhammadshahid3/agrocd
    path: project1
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: project1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
